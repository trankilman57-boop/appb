name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK dans le conteneur officiel kivy/buildozer
        run: |
          yes | docker run --rm -i \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            kivy/buildozer bash -c "sudo apt-get update && sudo apt-get install -y gettext && cd /home/user/hostcwd && yes | buildozer android debug"

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: suivi-bourse-apk
          path: bin/*.apk
